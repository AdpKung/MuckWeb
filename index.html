<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MuckWeb - Prototype</title>
  </head>
  <body>
    <!-- Debug log removed for production -->
    <div id="inventory-ui" style="display: none;">
        <div class="mc-inventory-container">
            <h2 style="text-align:center; margin-top:0; font-family:sans-serif; font-size:18px; color:#ddd;">Crafting</h2>
            
            <div class="mc-crafting-area">
                <div class="mc-recipe" id="btn-craft-workbench" title="Workbench (10 Wood)">
                    <div class="mc-slot recipe-slot" style="background:#5c4033">Work<br>bnch</div>
                </div>
                <div class="mc-recipe" id="btn-craft-campfire" title="Campfire (10 Wood, 5 Rock)">
                    <div class="mc-slot recipe-slot">Camp</div>
                </div>
                <div class="mc-recipe" id="btn-craft-wall" title="Wall (5 Wood)">
                    <div class="mc-slot recipe-slot">Wall</div>
                </div>
                <div class="mc-recipe" id="btn-craft-floor" title="Floor (5 Wood)">
                    <div class="mc-slot recipe-slot">Flr</div>
                </div>
            </div>

            <h2 style="text-align:left; margin:20px 0 5px 0; font-family:sans-serif; font-size:16px; color:#ddd;">Inventory</h2>
            <div class="mc-inventory-grid" id="mc-inventory-slots">
                <!-- Generated by JS -->
            </div>
            
            <p style="margin-top:20px; font-size:12px; color:#aaa; text-align:center;">Press E or Tab to close</p>
        </div>
    </div>

    <!-- Workbench UI (Hidden by default) -->
    <div id="workbench-ui" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 40; justify-content: center; align-items: center;">
        <div class="mc-inventory-container">
            <h2>Workbench</h2>
            <div class="mc-crafting-area" style="margin-top:20px;">
                <div class="mc-recipe" id="btn-craft-axe" title="Wood Axe (5 Wood)">
                    <div class="mc-slot recipe-slot">Axe</div>
                </div>
                <div class="mc-recipe" id="btn-craft-pickaxe" title="Stone Pickaxe (10 Wood, 10 Rock)">
                    <div class="mc-slot recipe-slot">Pick</div>
                </div>
                <div class="mc-recipe" id="btn-craft-sword" title="Sword (5 Wood, 5 Rock)">
                    <div class="mc-slot recipe-slot">Swrd</div>
                </div>
            </div>
            <p style="margin-top:20px; font-size:12px; color:#aaa; text-align:center;">Press E or Tab to close</p>
        </div>
    </div>
    
    <!-- Damage Numbers Container -->
    <div id="damage-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10;"></div>
    
    <div id="ui-layer">
        <div id="day-ui-container" style="position:absolute; top:20px; left:20px; width:200px; font-family:sans-serif;">
            <div id="day-ui" style="font-size:24px; font-weight:bold; color:white; text-shadow: 2px 2px 0 #000; margin-bottom: 5px;">
                Day 1
            </div>
            <div style="width:100%; height:10px; background:#333; border:2px solid #000; border-radius:5px; overflow:hidden;">
                <div id="day-bar" style="width:0%; height:100%; background:#ffd700;"></div>
            </div>
        </div>
        <div id="coin-ui" style="position:absolute; top:20px; right:20px; font-size:24px; font-weight:bold; color:gold; text-shadow: 2px 2px 0 #000;">
            💰 0
        </div>
        
        <!-- Boss UI -->
        <div id="boss-ui" style="display:none; position:absolute; top:20px; left:50%; transform:translateX(-50%); width:500px; text-align:center; font-family:sans-serif;">
            <div id="boss-name" style="color:white; font-size:20px; font-weight:bold; margin-bottom:5px; text-shadow: 2px 2px 0 #000;">Big Chunk</div>
            <div style="width:100%; height:25px; background:#333; border:3px solid #000; border-radius:5px; overflow:hidden;">
                <div id="boss-hp-bar" style="width:100%; height:100%; background:linear-gradient(90deg, #ff0000, #aa0000); transition:width 0.2s;"></div>
            </div>
        </div>
        
        <div id="powerup-ui" style="position:absolute; bottom:20px; right:20px; display:flex; flex-direction:column; gap:5px; align-items:flex-end; font-family:sans-serif; color:white; text-shadow:1px 1px 0 #000;">
            <!-- Generated by JS -->
        </div>
        <div style="position:absolute; bottom:80px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:5px; width:300px;">
            <div id="hp-ui" style="width:100%; height:20px; background:#333; border:2px solid #000; border-radius:10px; overflow:hidden;">
                <div id="hp-bar" style="width:100%; height:100%; background:#ff4444; transition:width 0.2s;"></div>
            </div>
            <div id="hunger-ui" style="width:100%; height:15px; background:#333; border:2px solid #000; border-radius:10px; overflow:hidden;">
                <div id="hunger-bar" style="width:100%; height:100%; background:#ffaa00; transition:width 0.2s;"></div>
            </div>
            <div id="stamina-ui" style="width:100%; height:10px; background:#333; border:2px solid #000; border-radius:10px; overflow:hidden;">
                <div id="stamina-bar" style="width:100%; height:100%; background:#44aaff; transition:width 0.1s;"></div>
            </div>
        </div>
        <div id="crosshair"></div>
        <div class="hotbar">
            <div class="hotbar-slot active">1</div>
            <div class="hotbar-slot">2</div>
            <div class="hotbar-slot">3</div>
            <div class="hotbar-slot">4</div>
            <div class="hotbar-slot">5</div>
            <div class="hotbar-slot">6</div>
            <div class="hotbar-slot">7</div>
        </div>
    </div>
    
    <div id="blocker">
        <div id="instructions">
            <h1 id="game-over-text" style="display:none; color:red; font-size:64px; text-shadow: 2px 2px 0 #000;">GAME OVER</h1>
            <p style="font-size:36px; margin-bottom:10px;" id="click-to-play-text">Click to Play</p>
            <p>
                Move: WASD<br/>
                Jump: SPACE<br/>
                Look: Mouse<br/>
                Mine/Attack: Left Click<br/>
                Inventory: E or Tab
            </p>
        </div>
    </div>
    
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
